services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: pravaah_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pravaah}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pravaah}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pravaah_net


  redis:
    image: redis:7-alpine
    container_name: pravaah_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pravaah_net


  ml-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ml-service
    container_name: pravaah_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pravaah_net


  db-migrate:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: pravaah_db_migrate
    restart: "no"
    command: sh -c "cd /app/packages/database && bunx prisma db push && echo 'Database schema updated successfully'"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pravaah}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pravaah_net


  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: pravaah_api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pravaah}?sslmode=disable
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:-pravaah_jwt_secret_sih2026}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - pravaah_net


  workers:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.workers
    container_name: pravaah_workers
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pravaah}?sslmode=disable
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
      api:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - pravaah_net


  web:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.web
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://pravaah.ashuttosh.me}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://pravaah.ashuttosh.me}
    container_name: pravaah_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - pravaah_net


  nginx:
    image: nginx:alpine
    container_name: pravaah_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dockerfiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    networks:
      - pravaah_net


  certbot:
    image: certbot/certbot:latest
    container_name: pravaah_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles:
      - certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - pravaah_net


  db-seed:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: pravaah_db_seed
    command: sh -c "cd /app/packages/database && bun run seed.ts"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pravaah}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    profiles:
      - seed
    networks:
      - pravaah_net

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:

networks:
  pravaah_net:
    driver: bridge
